name: HAG-RAP Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: TypeCheck + Build + Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: TypeCheck Frontend
      run: npm run typecheck
      env:
        CI: true
    
    - name: TypeCheck Server
      run: npm run typecheck:server
      env:
        CI: true
    
    - name: Build Frontend
      run: npm run build
      env:
        CI: true
    
    - name: Run Tests (Vitest)
      run: npm test -- --run --reporter=verbose
      env:
        CI: true
        NODE_ENV: test
    
    - name: Upload test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-failure-logs
        path: |
          *.log
          data/*.db
        retention-days: 7

  smoke-test:
    name: HTTP Smoke Test
    runs-on: ubuntu-latest
    needs: verify
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build Frontend
      run: npm run build
    
    - name: Start Server
      run: |
        npm run server &
        SERVER_PID=$!
        echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
        sleep 5
    
    - name: Health Check
      run: |
        curl -f http://localhost:4000/api/v1/health || exit 1
    
    - name: Test Cases Endpoint
      run: |
        curl -f http://localhost:4000/api/v1/cases || exit 1
    
    - name: Test Evaluation Endpoint
      run: |
        curl -f -X POST http://localhost:4000/api/v1/evaluations \
          -H "Content-Type: application/json" \
          -d '{"claimId":"CLM-001","caseId":"CASE-001"}' || exit 1
    
    - name: Stop Server
      if: always()
      run: |
        if [ ! -z "$SERVER_PID" ]; then
          kill $SERVER_PID || true
        fi
