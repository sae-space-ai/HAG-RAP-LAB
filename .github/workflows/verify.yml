name: HAG-RAP Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: TypeCheck + Build + Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: TypeCheck Frontend
      run: npm run typecheck
      env:
        CI: true
    
    - name: TypeCheck Server
      run: npm run typecheck:server
      env:
        CI: true
    
    - name: Build Frontend
      run: npm run build
      env:
        CI: true
    
    - name: Run Tests (Vitest)
      run: npm test -- --run --reporter=verbose
      env:
        CI: true
        NODE_ENV: test
    
    - name: Execute synthetic DRE benchmark
      run: npm run benchmark:dre
      env:
        NODE_ENV: test

    - name: Upload reproducible DRE fixture report
      uses: actions/upload-artifact@v4
      with:
        name: dre-synthetic-benchmark
        path: reports/dre-benchmark.json
        retention-days: 30

    - name: Upload test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-failure-logs
        path: |
          *.log
          data/*.db
        retention-days: 7

  smoke-test:
    name: HTTP Smoke Test
    runs-on: ubuntu-latest
    needs: verify
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build Frontend
      run: npm run build
    
    - name: Start Server
      run: |
        node --import tsx server/index.ts > /tmp/hagrap-start.log 2>&1 &
        echo "SERVER_PID=$!" >> "$GITHUB_ENV"
        READY=0
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:4000/api/v1/health >/dev/null; then
            READY=1
            break
          fi
          sleep 1
        done
        if [ "$READY" != "1" ]; then
          cat /tmp/hagrap-start.log
          exit 1
        fi
    
    - name: Health Check
      run: |
        curl -f http://localhost:4000/api/v1/health || exit 1
    
    - name: Test Cases Endpoint
      run: |
        curl -f http://localhost:4000/api/v1/cases || exit 1
    
    - name: Test Evaluation Endpoint
      run: |
        curl -f -X POST http://localhost:4000/api/v1/evaluations \
          -H "Content-Type: application/json" \
          -d '{"claimId":"CLM-001","caseId":"CASE-001"}' || exit 1
    
    - name: Verify DRE-Lite HTTP hypotheses and provenance
      run: |
        set -euo pipefail
        curl -fsS "http://localhost:4000/api/v1/dre/rules" > /tmp/hagrap-dre-rules.json
        curl -fsS -X POST http://localhost:4000/api/v1/dre/evaluate \
          -H "Content-Type: application/json" \
          -d '{"claimId":"CLM-001","hypothesis":{"predicate":"synthetic_review_priority","value":"LOW"}}' > /tmp/hagrap-dre-result.json
        node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync("/tmp/hagrap-dre-result.json","utf8")).result; if(x.verdict!=="ENTAILED" || x.trace.length!==2 || x.references.length<2 || x.decision!=="PROCEED") process.exit(1); console.log("PASS DRE-Lite inference:",x.traceHash)'
        curl -fsS -X POST http://localhost:4000/api/v1/dre/evaluate \
          -H "Content-Type: application/json" \
          -d '{"claimId":"CLM-002","hypothesis":{"predicate":"synthetic_review_priority","value":"REVIEW"}}' > /tmp/hagrap-dre-abstain.json
        node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync("/tmp/hagrap-dre-abstain.json","utf8")).result; if(x.verdict!=="INCONSISTENT_EVIDENCE" || x.decision!=="ABSTAIN") process.exit(1); console.log("PASS DRE-Lite abstention")'
        node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync("/tmp/hagrap-dre-result.json","utf8")).result; if(x.limits.persistentDRETrace!==true || !x.id.startsWith("DRE-EVAL-")) process.exit(1)'


    - name: Verify bounded synthetic abduction on two domains
      run: |
        set -euo pipefail
        curl -fsS -X POST http://localhost:4000/api/v1/dre/abduction/evaluate \
          -H "Content-Type: application/json" -d '{"claimId":"CLM-001"}' > /tmp/hag-abd-meteo.json
        curl -fsS -X POST http://localhost:4000/api/v1/dre/abduction/evaluate \
          -H "Content-Type: application/json" -d '{"claimId":"ABD-TECH-OBS-A"}' > /tmp/hag-abd-tech.json
        node -e 'const fs=require("node:fs");for(const file of ["meteo","tech"]){const r=JSON.parse(fs.readFileSync("/tmp/hag-abd-"+file+".json","utf8")).result;if(r.verdict!=="MULTIPLE_EXPLANATIONS"||r.decision!=="ABSTAIN"||r.candidates.length!==2||r.references.length<2||!r.discriminators.length)process.exit(1)};console.log("PASS: two-domain candidate generation without causal claims")'

    - name: Verify SQLite persistence across process restart
      run: |
        set -euo pipefail
        curl -fsS -X POST http://localhost:4000/api/v1/evaluations \
          -H "Content-Type: application/json" \
          -d '{"claimId":"CLM-001","caseId":"CASE-001"}' > /tmp/hagrap-before.json
        node -e "const a=require('/tmp/hagrap-before.json'); if(!a.evaluation?.id) process.exit(1)"
        kill "$SERVER_PID"
        sleep 2
        node --import tsx server/index.ts > /tmp/hagrap-restart.log 2>&1 &
        echo "SERVER_PID=$!" >> "$GITHUB_ENV"
        READY=0
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:4000/api/v1/health >/dev/null; then
            READY=1
            break
          fi
          sleep 1
        done
        if [ "$READY" != "1" ]; then
          cat /tmp/hagrap-restart.log
          exit 1
        fi
        EVAL_ID=$(node -e "process.stdout.write(require('/tmp/hagrap-before.json').evaluation.id)")
        curl -fsS "http://localhost:4000/api/v1/evaluations/$EVAL_ID" > /tmp/hagrap-after.json
        node -e "const a=require('/tmp/hagrap-before.json').evaluation;const b=require('/tmp/hagrap-after.json').evaluation;if(a.id!==b.id || a.inputsHash!==b.inputsHash) process.exit(1);console.log('PASS: persisted evaluation restored after process restart:',a.id)"
        DRE_ID=$(node -e "process.stdout.write(require('/tmp/hagrap-dre-result.json').result.id)")
        curl -fsS "http://localhost:4000/api/v1/dre/evaluations/$DRE_ID" > /tmp/hagrap-dre-recovered.json
        node -e 'const fs=require("node:fs"); const b=JSON.parse(fs.readFileSync("/tmp/hagrap-dre-result.json","utf8")).result;const a=JSON.parse(fs.readFileSync("/tmp/hagrap-dre-recovered.json","utf8")); if(!a.integrityValid || a.result.id!==b.id || a.result.traceHash!==b.traceHash) process.exit(1); console.log("PASS DRE-Lite trace persisted across Express restart",b.id)'


    - name: Verify abduction trace after server restart
      run: |
        set -euo pipefail
        ABD_ID=$(node -e "process.stdout.write(require('/tmp/hag-abd-tech.json').result.id)")
        curl -fsS "http://localhost:4000/api/v1/dre/abduction/runs/$ABD_ID" > /tmp/hag-abd-restarted.json
        node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync("/tmp/hag-abd-restarted.json","utf8"));if(r.integrityValid!==true||r.result.decision!=="ABSTAIN")process.exit(1);console.log("PASS: persisted abduction trace recovered")'

    - name: Verify seed endpoint locked without token
      run: |
        STATUS=$(curl -s -o /tmp/hagrap-seed.json -w '%{http_code}' -X POST http://localhost:4000/api/v1/seed -H "Content-Type: application/json" -d '{}')
        test "$STATUS" = "401"

    - name: Stop Server
      if: always()
      run: |
        if [ -n "${SERVER_PID:-}" ]; then
          kill "$SERVER_PID" || true
        fi
