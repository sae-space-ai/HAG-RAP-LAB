openapi: 3.0.3
info:
  title: HAG-RAP LAB API
  description: |
    API HTTP del prototipo HAG-RAP Fase 1.
    Todos los datos son SYNTHETIC. No usar para decisiones operativas.
    PROTOTIPO EXPERIMENTAL — SIN VALIDACIÓN TRL.
  version: 1.0.0
  contact:
    name: HAG-RAP Research Team

servers:
  - url: http://localhost:4000/api/v1
    description: Servidor local de desarrollo

paths:
  /health:
    get:
      summary: Estado de salud del proceso
      operationId: getHealth
      tags: [System]
      responses:
        '200':
          description: Estado OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                  runtime:
                    type: string
                  dependencies:
                    type: object
                  stats:
                    type: object

  /capabilities:
    get:
      summary: Estado de los 7 componentes del sistema
      operationId: getCapabilities
      tags: [System]
      responses:
        '200':
          description: Lista de componentes con estados reales
          content:
            application/json:
              schema:
                type: object
                properties:
                  components:
                    type: array
                    items:
                      $ref: '#/components/schemas/Component'
                  totalImplemented:
                    type: integer
                  totalNotImplemented:
                    type: integer

  /cases:
    get:
      summary: Lista de casos sintéticos disponibles
      operationId: getCases
      tags: [Cases]
      responses:
        '200':
          description: Lista de casos
          content:
            application/json:
              schema:
                type: object
                properties:
                  cases:
                    type: array
                    items:
                      $ref: '#/components/schemas/Case'
                  classification:
                    type: string
                    enum: [SYNTHETIC]

  /cases/{id}:
    get:
      summary: Detalle de un caso sintético
      operationId: getCaseById
      tags: [Cases]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Caso con claim, evidencias y fuentes
        '404':
          description: Caso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /evaluations:
    post:
      summary: Evaluar una afirmación contra evidencias
      operationId: createEvaluation
      tags: [Evaluations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationInput'
      responses:
        '201':
          description: Evaluación creada y persistida
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluation:
                    $ref: '#/components/schemas/EvaluationResult'
                  classification:
                    type: string
                    enum: [SYNTHETIC]
        '400':
          description: Entrada inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Listar evaluaciones persistidas
      operationId: listEvaluations
      tags: [Evaluations]
      responses:
        '200':
          description: Lista de evaluaciones

  /evaluations/{id}:
    get:
      summary: Obtener evaluación persistida por ID
      operationId: getEvaluationById
      tags: [Evaluations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Evaluación completa
        '404':
          description: Evaluación no encontrada

  /sources:
    get:
      summary: Listar fuentes sintéticas
      tags: [Data]
      responses:
        '200':
          description: Fuentes

  /claims:
    get:
      summary: Listar afirmaciones sintéticas
      tags: [Data]
      responses:
        '200':
          description: Afirmaaciones

  /audit:
    get:
      summary: Eventos de auditoría y verificación de cadena
      tags: [System]
      responses:
        '200':
          description: Eventos y estado de cadena

  /seed:
    post:
      summary: Cargar datos sintéticos (idempotente)
      operationId: seedData
      tags: [Admin]
      parameters:
        - name: x-dev-token
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Datos cargados
        '401':
          description: Token no válido

components:
  schemas:
    Component:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        fullName:
          type: string
        status:
          type: string
          enum: [VERIFICADO_LOCAL, IMPLEMENTADO_SIN_VERIFICAR, NO_IMPLEMENTADO, BLOQUEADO]
        description:
          type: string
        workPackage:
          type: string

    Case:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        expectedVerdict:
          type: string
        claimId:
          type: string
        classification:
          type: string
          enum: [SYNTHETIC]

    EvaluationInput:
      type: object
      properties:
        claimId:
          type: string
        caseId:
          type: string
        subject:
          type: string
        predicate:
          type: string
        proposedValue:
          type: string
        sourceIds:
          type: array
          items:
            type: string

    EvaluationResult:
      type: object
      properties:
        id:
          type: string
        caseId:
          type: string
          nullable: true
        algorithmVersion:
          type: string
        verdict:
          type: string
          enum: [SUPPORTED, CONTRADICTED, INSUFFICIENT_EVIDENCE, ERROR]
        decision:
          type: string
          enum: [PROCEED, ABSTAIN]
        appliedRule:
          type: string
        inputsHash:
          type: string
        explanation:
          type: string
        supportingSourceIds:
          type: array
          items:
            type: string
        contradictingSourceIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string
